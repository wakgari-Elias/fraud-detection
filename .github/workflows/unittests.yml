name: Unit Tests

on:
  push:
    branches: [ capstone-improvement, main ]
  pull_request:
    branches: [ capstone-improvement, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python (use your version – 3.12 is fine)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run all pytest tests (verbose mode for clear output)
      - name: Run unit tests with pytest
        run: |
          pytest tests/ -v --tb=short

      # (Optional) Step 5: If you later add coverage reporting
      # - name: Upload coverage report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: pytest-coverage
      #     path: coverage.xml
         - name: Install pytest-cov
     run: pip install pytest-cov

   - name: Run tests with coverage
     run: pytest --cov=src --cov-report=xml tests/

   - name: Upload coverage to Codecov (optional)
     uses: codecov/codecov-action@v4
     with:
       token: ${{ secrets.CODECOV_TOKEN }}  # optional
       file: coverage.xml